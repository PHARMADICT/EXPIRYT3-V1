<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f0faf8">
  <title>PharmaScan Pro - T3 Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @import "tailwindcss";
    @theme {
      --color-teal-500: oklch(0.680 0.124 178);
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ── GLASSMORPHISM CORE ── */
    .glass-base {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .glass-teal {
      background: rgba(240, 250, 248, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(20, 184, 166, 0.1);
    }

    body { 
      background: #f8fafc; 
      color: #1e293b; 
      font-family: var(--font-sans);
      overscroll-behavior: none;
    }

    .page { display: none; }
    .page.active { display: block; animation: fadeUp 0.3s ease; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    
    /* Custom Safe Area for Dubai/Boots Style */
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <div id="splash" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center p-8 transition-opacity duration-500">
    <div class="w-20 h-20 bg-teal-500 rounded-3xl flex items-center justify-center text-4xl mb-6 shadow-2xl">💊</div>
    <h1 class="text-white font-extrabold text-2xl tracking-tighter">PharmaScan <span class="text-teal-400">Pro</span></h1>
    <p class="text-slate-400 text-xs font-bold tracking-widest mt-2 uppercase">Boots T3 · Dubai</p>
    
    <div class="w-full max-w-xs bg-slate-800 h-1.5 rounded-full mt-12 overflow-hidden">
      <div id="loaderFill" class="bg-teal-500 h-full w-0 transition-all duration-300"></div>
    </div>
    <p id="loaderText" class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-4">Initializing Systems...</p>
  </div>

  <header class="glass-base sticky top-0 z-50 px-4 py-3 safe-top shadow-sm border-b border-slate-200">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-teal-500 rounded-xl flex items-center justify-center text-white text-xl shadow-lg">💊</div>
        <div>
          <h2 class="font-extrabold text-sm text-slate-800 leading-none">PharmaScan Pro</h2>
          <p class="text-[10px] font-bold text-teal-600 uppercase tracking-widest mt-1">Registry Control v7</p>
        </div>
      </div>
      <div class="text-right">
        <div id="productCount" class="text-xs font-bold text-slate-700">0 Items</div>
        <div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">MOHAP Verified</div>
      </div>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto pb-24">
    
    <section id="pageScan" class="page active p-4 space-y-4">
      <div class="glass-teal p-4 rounded-2xl shadow-sm border border-teal-100">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Search Registry</p>
        <div class="flex items-center gap-3 bg-white/80 border border-slate-200 rounded-xl px-4 shadow-inner">
          <input id="searchInput" type="text" placeholder="Trade Name or Ingredient..." 
                 class="w-full h-12 text-sm font-semibold text-slate-700 outline-none bg-transparent">
          <button id="searchClear" class="text-slate-400 hidden">✕</button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div class="glass-base p-3 rounded-xl text-center">
          <div id="sTotal" class="text-lg font-extrabold text-teal-600">0</div>
          <div class="text-[9px] font-bold text-slate-400 uppercase">Total</div>
        </div>
        <div id="cycleBox" class="glass-base p-3 rounded-xl text-center cursor-pointer">
          <div id="sCycleVal" class="text-lg font-extrabold text-slate-700">0</div>
          <div id="sCycleLabel" class="text-[9px] font-bold text-slate-400 uppercase">Suppliers</div>
        </div>
        <div class="glass-base p-3 rounded-xl text-center">
          <div id="sAvgPrice" class="text-lg font-extrabold text-teal-600">0</div>
          <div class="text-[9px] font-bold text-slate-400 uppercase">Avg AED</div>
        </div>
      </div>

      <div id="productGrid" class="space-y-3">
        </div>
      
      <div id="loadMoreWrap" class="hidden text-center py-4">
        <button onclick="loadMore()" class="text-xs font-bold text-teal-600 uppercase tracking-widest bg-white px-6 py-2 rounded-full border border-teal-100 shadow-sm">Load More</button>
      </div>
    </section>

    <section id="pageDashboard" class="page p-4">
      <h1 class="text-xl font-bold">Dashboard Coming Soon</h1>
    </section>
  </main>

  <nav class="glass-base fixed bottom-4 left-4 right-4 h-16 rounded-2xl shadow-xl flex items-center justify-around z-50 border border-white/50">
    <button class="nav-btn flex flex-col items-center gap-1 text-teal-600" onclick="showPage('pageScan', this)">
      <span class="text-xl">📋</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">Registry</span>
    </button>
    <button class="nav-btn flex flex-col items-center gap-1 text-slate-400" onclick="showPage('pageDashboard', this)">
      <span class="text-xl opacity-50">📊</span>
      <span class="text-[9px] font-bold uppercase tracking-widest">Stats</span>
    </button>
  </nav>

  <div id="modalOverlay" class="fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-sm hidden flex items-end justify-center p-4" onclick="closeModal(event)">
    <div class="glass-base w-full max-w-md rounded-3xl shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-300" onclick="event.stopPropagation()">
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <div>
            <span id="mClass" class="text-[10px] font-bold text-teal-500 uppercase tracking-widest">Classification</span>
            <h3 id="mTitle" class="text-xl font-extrabold text-slate-800 tracking-tight leading-tight">Product Name</h3>
          </div>
          <div id="mPrice" class="bg-teal-500 text-white font-bold px-3 py-1 rounded-lg text-sm shadow-teal">0.00 AED</div>
        </div>
        
        <div class="space-y-4 mt-6">
          <div class="bg-slate-50/50 p-3 rounded-xl border border-slate-100">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Active Ingredient</p>
            <p id="mIngredient" class="text-sm text-slate-700 font-semibold leading-relaxed whitespace-pre-wrap"></p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="p-3 bg-white/50 rounded-xl border border-slate-100">
              <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Supplier</p>
              <p id="mSupplier" class="font-bold text-slate-700"></p>
            </div>
            <div class="p-3 bg-white/50 rounded-xl border border-slate-100">
              <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Dispensing</p>
              <p id="mDispensing" class="font-bold text-teal-600"></p>
            </div>
          </div>
        </div>
        
        <button onclick="closeModalBtn()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl mt-8 shadow-lg press">Close Registry</button>
      </div>
    </div>
  </div>

  <script>
    // CORE APP LOGIC
    const PAGE_SIZE = 40;
    let allData = [];
    let filteredData = [];
    let displayData = [];
    let currentPage = 0;
    let searchQuery = '';

    const HEADERS = ['Trade Name','Price','Pack Size','Strength','Supplier Address','Supplier',
      'Ingredient','Body System','Form','Classification','Therapeutic Group','Manufacturer',
      'Country Of Origin','Dispensing Mode','First Registration Date'];
    const HI = {};
    HEADERS.forEach((h,i) => HI[h] = i);

    // 1. DATA LOADER (Gzip + Base64)
    window.addEventListener('load', () => {
      const fill = document.getElementById('loaderFill');
      const txt = document.getElementById('loaderText');

      setTimeout(() => {
        try {
          // Assume MOHAP_DATA_B64 is available via data.js
          const binaryStr = atob(MOHAP_DATA_B64);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

          const ds = new DecompressionStream('gzip');
          const writer = ds.writable.getWriter();
          writer.write(bytes);
          writer.close();

          const reader = ds.readable.getReader();
          const chunks = [];

          function read() {
            reader.read().then(({ done, value }) => {
              if (done) {
                const blob = new Blob(chunks);
                blob.text().then(text => {
                  allData = JSON.parse(text).rows;
                  fill.style.width = '100%';
                  txt.textContent = 'Registry Ready';
                  setTimeout(initApp, 400);
                });
                return;
              }
              chunks.push(value);
              fill.style.width = '60%';
              read();
            });
          }
          read();
        } catch(e) {
          txt.textContent = 'Error Loading Database';
        }
      }, 500);
    });

    function initApp() {
      document.getElementById('splash').style.opacity = '0';
      setTimeout(() => document.getElementById('splash').remove(), 500);
      applyAll();
      
      const search = document.getElementById('searchInput');
      search.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        applyAll();
      });
    }

    function applyAll() {
      let data = allData;
      if (searchQuery) {
        data = data.filter(r => 
          r[HI['Trade Name']].toLowerCase().includes(searchQuery) ||
          r[HI['Ingredient']].toLowerCase().includes(searchQuery) ||
          r[HI['Supplier']].toLowerCase().includes(searchQuery)
        );
      }
      filteredData = data;
      currentPage = 0;
      displayData = filteredData.slice(0, PAGE_SIZE);
      renderGrid();
      updateStats();
    }

    function renderGrid() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      
      displayData.forEach(row => {
        const card = document.createElement('div');
        card.className = "glass-base p-4 rounded-2xl flex justify-between items-center animate-in fade-in duration-300";
        card.innerHTML = `
          <div class="flex-1 pr-4">
            <div class="text-[10px] font-bold text-teal-500 uppercase tracking-widest">${row[HI['Dispensing Mode']]}</div>
            <div class="text-sm font-extrabold text-slate-800 leading-tight">${row[HI['Trade Name']]}</div>
            <div class="text-[10px] font-semibold text-slate-400 mt-1">${row[HI['Supplier']]}</div>
          </div>
          <div class="text-right">
            <div class="text-xs font-extrabold text-slate-700">${row[HI['Price']] || 'Exempt'}</div>
            <div class="text-[9px] font-bold text-slate-400 uppercase mt-1">AED</div>
          </div>
        `;
        card.onclick = () => openModal(row);
        grid.appendChild(card);
      });
      
      document.getElementById('loadMoreWrap').classList.toggle('hidden', displayData.length >= filteredData.length);
    }

    function loadMore() {
      currentPage++;
      const next = filteredData.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
      displayData = [...displayData, ...next];
      renderGrid();
    }

    function updateStats() {
      document.getElementById('productCount').textContent = `${filteredData.length.toLocaleString()} Items`;
      document.getElementById('sTotal').textContent = allData.length.toLocaleString();
      document.getElementById('sMatch').textContent = filteredData.length.toLocaleString();
      
      const prices = filteredData.map(r => parseFloat(r[HI['Price']])).filter(n => !isNaN(n));
      const avg = prices.length ? (prices.reduce((a,b)=>a+b,0)/prices.length).toFixed(0) : '0';
      document.getElementById('sAvgPrice').textContent = avg;
    }

    function openModal(row) {
      document.getElementById('mTitle').textContent = row[HI['Trade Name']];
      document.getElementById('mPrice').textContent = (row[HI['Price']] || 'Exempt') + ' AED';
      document.getElementById('mIngredient').textContent = row[HI['Ingredient']].replace(/!/g, '\n');
      document.getElementById('mSupplier').textContent = row[HI['Supplier']];
      document.getElementById('mDispensing').textContent = row[HI['Dispensing Mode']];
      document.getElementById('mClass').textContent = row[HI['Classification']];
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModalBtn() { document.getElementById('modalOverlay').classList.add('hidden'); }
    function showPage(id, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-teal-600', 'text-slate-400'));
      btn.classList.replace('text-slate-400', 'text-teal-600');
    }
  </script>
</body>
</html>
